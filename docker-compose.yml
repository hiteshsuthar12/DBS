services:
  # 1. MONGODB DATABASE
  mongodb:
    image: mongo:7.0
    container_name: smart_inventory_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-inventory_db}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  # 2. PYTHON FASTAPI AI FORECASTING SERVICE
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart_inventory_ai_service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  # 3. JAVA SPRING BOOT CORE BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_inventory_backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-root}@mongodb:27017/${MONGO_DATABASE:-inventory_db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - inventory_network

  # 4. REACT TYPESCRIPT VITE FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_inventory_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - inventory_network

volumes:
  mongodb_data:
    driver: local

networks:
  inventory_network:
    driver: bridge
