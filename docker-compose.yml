services:
  # 1. POSTGRESQL DATABASE
  postgres:
    image: postgres:16-alpine
    container_name: smart_inventory_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  # 2. PYTHON FASTAPI AI FORECASTING SERVICE
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart_inventory_ai_service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  # 3. JAVA SPRING BOOT CORE BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_inventory_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-inventory_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - inventory_network

  # 4. REACT TYPESCRIPT VITE FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_inventory_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - inventory_network

volumes:
  postgres_data:
    driver: local

networks:
  inventory_network:
    driver: bridge

