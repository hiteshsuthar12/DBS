server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-inventory-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/inventory_db}
      auto-index-creation: true

# JWT Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.inventory: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
