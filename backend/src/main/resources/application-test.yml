server:
  port: 0

spring:
  application:
    name: smart-inventory-backend-test

  datasource:
    url: jdbc:h2:mem:inventory_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
  ai-service:
    url: http://localhost:8000
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

logging:
  level:
    com.inventory: WARN
    org.springframework: WARN
